name: v3-db

on:
  push:
    paths:
      - "apps/backend/**"
      - "contracts/v3/**"
      - "migrations/**"
      - "scripts/migrate/**"
      - "specs/SPEC-01-DATA-MODEL.md"
      - "deploy/postgres/**"
      - "deploy/docker-compose.prod.yml"
      - ".github/workflows/v3-db.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "contracts/v3/**"
      - "migrations/**"
      - "scripts/migrate/**"
      - "specs/SPEC-01-DATA-MODEL.md"
      - "deploy/postgres/**"
      - "deploy/docker-compose.prod.yml"
      - ".github/workflows/v3-db.yml"
  workflow_dispatch:

jobs:
  postgres-contract:
    name: PostgreSQL 16 + pgvector + PostGIS (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: El DDL v3.1 coincide con la spec (sin deriva)
        run: |
          python scripts/migrate/generate_v31_schema.py
          git diff --exit-code -- migrations/v3.1/0001_schema.sql contracts/v3/db-contract-v3.1.sql
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements-dev.txt
      - name: Run T-H1 y v3.1 integration tests (migración, RLS, decisiones, EXPLAIN)
        working-directory: apps/backend
        run: python -m pytest tests/v3/db -q -rs
