name: v3-db

on:
  push:
    paths:
      - "apps/backend/**"
      - "contracts/v3/**"
      - "deploy/docker-compose.prod.yml"
      - ".github/workflows/v3-db.yml"
  pull_request:
    paths:
      - "apps/backend/**"
      - "contracts/v3/**"
      - "deploy/docker-compose.prod.yml"
      - ".github/workflows/v3-db.yml"
  workflow_dispatch:

jobs:
  postgres-contract:
    name: PostgreSQL 16 + pgvector (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/backend/requirements-dev.txt
      - name: Run T-H1 integration tests
        working-directory: apps/backend
        run: python -m pytest tests/v3/db -q
