[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osint-nexus-hermes"
version = "3.1.0"
description = "Harness Hermes v3.1: tools, OPSEC e idempotencia"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["hermes_harness*"]
