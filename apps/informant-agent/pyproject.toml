[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "informant-agent"
version = "2.0.0"
description = "AI_INFORMANT — servicio autónomo de recolección OSINT (cliente M2M) de OSINT Nexus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
informant-agent = "informant_agent.cli:main"

[tool.setuptools]
packages = ["informant_agent", "informant_agent.collectors"]
